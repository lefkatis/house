<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="lefkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="64" height="64" rx="15" fill="url(#lefkGrad)" />
  
  <!-- Subtle border highlight -->
  <rect x="1" y="1" width="62" height="62" rx="14" fill="none" stroke="white" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- Smart House Outline -->
  <path d="M32 11 L13 26 L17 26 L17 49 C17 50.7 18.3 52 20 52 L44 52 C45.7 52 47 50.7 47 49 L47 26 L51 26 Z" 
        fill="none" 
        stroke="white" 
        stroke-width="3" 
        stroke-linejoin="round" 
        stroke-linecap="round" 
        filter="url(#glow)" />

  <!-- Electric Bolt in the center -->
  <path d="M34 21 L23 35 L31 35 L27 47 L41 33 L33 33 Z" 
        fill="url(#boltGrad)" 
        stroke="#ffffff" 
        stroke-width="1"
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Tech/Smart Network Connection Nodes -->
  <circle cx="21" cy="46" r="2.2" fill="#a5f3fc" />
  <circle cx="43" cy="46" r="2.2" fill="#a5f3fc" />
</svg>
