<!DOCTYPE html>
<html lang="el">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House</title>
    <script>
      // Single Page Application router for GitHub Pages
      var pathname = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;

      if (pathname.indexOf('/admin') !== -1) {
        var cleanSearch = search ? '&' + search.replace(/^\?/, '') : '';
        window.location.replace('/?view=admin' + cleanSearch + hash);
      } else {
        window.location.replace('/' + search + hash);
      }
    </script>
  </head>
  <body style="font-family: system-ui, sans-serif; background: #0a0a0a; color: #fff; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <p>Φόρτωση...</p>
  </body>
</html>
